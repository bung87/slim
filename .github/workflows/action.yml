name: Build

on:
  push:
    paths-ignore: 
      - README.md
  pull_request:
    paths-ignore: 
      - README.md

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - windows-latest
          # - macOS-latest
        experimental: [false]
        nim-version:
          - stable
          - devel
        include:
          - os: windows-latest
            experimental: true
            # nim-version: 1.6.0
            #   - stable
            #   - devel
        # exclude:
          - os: macos-latest
            experimental: true
            # nim-version: 1.6.0
            #   - stable
            #   - devel
            # nim-version: stable
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cache nimble
      id: cache-nimble
      uses: actions/cache@v4
      with:
        path: ~/.nimble
        key: ${{ runner.os }}-nimble-v2-${{ matrix.nim-version}}-${{ hashFiles('*.nimble') }}
        restore-keys: |
          ${{ runner.os }}-nimble-v2-${{ matrix.nim-version}}-
      if: runner.os != 'Windows'
    - name: Setup nim
      uses: iffy/install-nim@v5
      with:
        version: ${{ matrix.nim-version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Packages
      run: nimble install -d -y
   
    - name: Build
      run: nimble build